name: Daily hack post

on:
  schedule:
    # 13:00 IST = 07:30 UTC. Adjust to your audience's peak.
    - cron: "30 7 * * *"
  workflow_dispatch: {}   # lets you trigger manually to test

permissions:
  contents: write   # needed to commit the slides + state counter

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pillow

      - name: Pick today's carousel from the bank
        run: python scripts/pick.py

      - name: Render slides
        run: cp scripts/make_card.py . && python scripts/render.py

      - name: Commit slides + state, build SLIDE_URLS
        run: |
          mkdir -p published
          STAMP=$(date +%Y%m%d)
          git config user.name "hacks-bot"
          git config user.email "bot@users.noreply.github.com"
          urls=""
          for i in $(ls slide_*.png | sort -V); do
            idx="${i#slide_}"; idx="${idx%.png}"
            dest="published/${STAMP}_${idx}.png"
            cp "$i" "$dest"
            git add "$dest"
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${dest}"
            if [ -z "$urls" ]; then urls="$url"; else urls="$urls,$url"; fi
          done
          git add state.json
          git commit -m "post ${STAMP}" || echo "nothing to commit"
          git push
          sleep 10   # let raw.githubusercontent.com catch up before IG fetches
          echo "SLIDE_URLS=${urls}" >> $GITHUB_ENV

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SLIDE_URLS: ${{ env.SLIDE_URLS }}
        run: python scripts/publish.py
